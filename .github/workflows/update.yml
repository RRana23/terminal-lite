name: Nightly data update
on:
  schedule:
    - cron: "17 23 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas numpy requests lxml
      - run: python update.py
        env: { FRED_API_KEY: "${{ secrets.FRED_API_KEY }}" }
      - name: Save data for tomorrow's fallback
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add sp500.json extra.json housing.json
          git commit -m "Update data $(date -u +%F)" || echo "No changes"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - id: deploy
        uses: actions/deploy-pages@v4
