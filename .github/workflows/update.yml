name: Nightly data update
on:
  schedule:
    - cron: "17 23 * * 1-5"   # weekdays about 6-7 pm New York time
  workflow_dispatch:
  push:
    branches: [main]          # also rebuild whenever the code changes
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas numpy requests lxml
      - uses: actions/cache@v4          # last good data, so a failed fetch never breaks the site
        with:
          path: cache
          key: data-${{ github.run_id }}
          restore-keys: data-
      - run: python update.py
        env: { FRED_API_KEY: "${{ secrets.FRED_API_KEY }}" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - run: python send_alerts.py        # nightly alert email; off until the three secrets below exist
        if: github.event_name != 'push'
        env: { ALERT_EMAIL_TO: "${{ secrets.ALERT_EMAIL_TO }}", SMTP_USER: "${{ secrets.SMTP_USER }}", SMTP_PASS: "${{ secrets.SMTP_PASS }}" }
  deploy:                             # separate job: the artifact is fully saved before deploy looks for it
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
