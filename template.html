+P('What these holdings would have been worth, 2 years','<canvas id="pfc" class="sm" style="height:210px"></canvas><div class="mu">Uses today\u2019s share counts at past prices.</div>','c8')
+P('Holdings',T(['Ticker','Name','Shares','Cost','Price','Value','Weight','Day P&amp;L','Total P&amp;L',''],rs.map(r=>[r.t,r.nm,'<input type="number" step="any" class="in" value="'+r.n+'" onchange="pset(\''+r.t+'\',this.value)">',r.c?f(r.c):'-',f(r.p,r.p<10?4:2),usd(r.v),f(r.v/tv*100,1)+'%',sg(r.d),r.tot==null?'-':sg(r.tot),'<button data-a="prm" data-v="'+r.t+'" aria-label="Remove '+r.t+'" style="background:none;border:0;color:var(--mu);cursor:pointer">x</button>'])),'c12')
+P('Allocation',Object.entries(al).sort((a,b)=>b[1]-a[1]).map(([k,v])=>kv(k,f(v/tv*100,1)+'%')+'<span class="bar" style="width:'+(v/tv*100)+'%"></span>').join(''),'c4')
+P('Stress tests, worst 6',T(['Scenario','Est. loss','% of value','Hardest hit'],st.map(z=>[z.n,sg(z.l),f(z.l/tv*100,1)+'%',z.top[0]])).replace('<table','<table')+'<div class="mu" style="margin-top:6px">Estimate: exposure score divided by 10, times an assumed shock for each scenario. It ignores gains and hedges. Not a forecast.</div>','c8')}
let JOB=0,RK=3,FA=1e6,_ST;
const nm=t=>CO[t]?CO[t][0]:EXT[t].n,LK=(t,n)=>'<button data-a="open" data-v="'+t+'" style="background:none;border:0;color:var(--am);cursor:pointer;padding:0">'+(n||t)+'</button>',pc=(v,d=1)=>v==null||isNaN(v)?'-':'<span class="'+(v>=0?'up':'dn')+'">'+(v>=0?'+':'')+f(v,d)+'%</span>',rn=(c,n)=>c.length>n?(c.at(-1)/c.at(-1-n)-1)*100:null,KV=(a,b)=>'<div class="kv"><span class="mu">'+a+'</span><span class="m">'+b+'</span></div>',dg=v=>v<10?4:2;
const MON=['^GSPC','^IXIC','^DJI','^RUT','^VIX','^TNX','EURUSD=X','JPY=X','GLD','USO','BTC-USD'];
function mon(){return T(['Name','Last','1d'],MON.map(t=>{const c=EXT[t].c;return[LK(t,EXT[t].n),f(c.at(-1),dg(c.at(-1))),pc(rn(c,1),2)]}))}
function econ(){const c=yoy(HF('CPIAUCSL').v),co=yoy(HF('CPILFESL').v),d=HF('CPIAUCSL').d.slice(12);Q.push(()=>line('inf',[{d:c.slice(-120),c:'--am'},{d:co.slice(-120),c:'--up'}],x=>f(x,1)+'%'));
return P('Inflation, year over year (amber headline CPI, green core)','<div style="display:flex;gap:28px"><div><div class="big">'+f(c.at(-1),1)+'%</div><div class="mu">Headline CPI, '+d.at(-1)+'</div></div><div><div class="big">'+f(co.at(-1),1)+'%</div><div class="mu">Core (no food or energy)</div></div></div><canvas id="inf" class="sm" style="height:170px"></canvas><div class="mu">10 years. Source: BLS via FRED (CPIAUCSL, CPILFESL).</div>','c12')+housing()}
function rsiOf(c){let g=0,l=0;for(let i=c.length-14;i<c.length;i++){const z=c[i]-c[i-1];z>0?g+=z:l-=z}return 100-100/(1+(g||.01)/(l||.01))}
function STK(){return _ST||(_ST=Object.keys(RAW).map(t=>{const c=RAW[t].c,n=c.length,h=Math.max(...c.slice(-252));return{t,nm:CO[t][0],mom:n>253?(c[n-22]/c[n-253]-1)*100:null,y:rn(c,252),dd:(c[n-1]/h-1)*100,v:RAW[t].v,b:RAW[t].b,rsi:rsiOf(c)}}))}
const TOP=(k,n,asc,fm)=>T(['Ticker','Name',''],STK().filter(z=>z[k]!=null).sort((a,b)=>asc?a[k]-b[k]:b[k]-a[k]).slice(0,n).map(z=>[LK(z.t),z.nm,fm(z[k])]));
function risk(){const S0=STK(),vx=EXT['^VIX'].c.slice(-252);
return P('Market risk now',KV('VIX',f(vx.at(-1),1))+KV('VIX, 1-year range',f(Math.min(...vx),0)+' to '+f(Math.max(...vx),0))+KV('Average stock volatility',f(S0.reduce((a,z)=>a+z.v,0)/S0.length,1)+'%')+KV('Stocks 20%+ below 52w high',f(S0.filter(z=>z.dd<-20).length/S0.length*100,0)+'%')+KV('10Y minus 3M yield',f(EXT['^TNX'].c.at(-1)-EXT['^IRX'].c.at(-1),2)+' pts'),'c4')
+P('Highest volatility (60 days)',TOP('v',10,0,v=>f(v,1)+'%'),'c4')+P('Highest beta',TOP('b',10,0,v=>f(v,2)),'c4')+P('Deepest drawdown from 52-week high',TOP('dd',10,1,v=>pc(v)),'c6')+P('Lowest volatility',TOP('v',10,1,v=>f(v,1)+'%'),'c6')}
function quant(){return P('Momentum leaders (12 months, skipping the last month)',TOP('mom',10,0,v=>pc(v)))+P('Momentum laggards',TOP('mom',10,1,v=>pc(v)))+P('Most oversold (lowest RSI)',TOP('rsi',10,1,v=>f(v,0)))+P('Most overbought (highest RSI)',TOP('rsi',10,0,v=>f(v,0)))}
function macro(){const Y=['^IRX','^FVX','^TNX','^TYX'];Q.push(()=>line('mc',[{d:Y.map(t=>EXT[t].c.at(-1)),c:'--am'}],x=>f(x)+'%'),()=>line('mi',[{d:INF,c:'--am'}],x=>f(x,1)+'%'));
return P('Treasury yields',T(['Maturity','Yield','1y change'],Y.map(t=>[EXT[t].n.replace(' Treasury yield',''),f(EXT[t].c.at(-1))+'%',f(EXT[t].c.at(-1)-EXT[t].c.at(-253),2)+' pts']))+'<canvas id="mc" class="sm"></canvas><div class="mu">Curve: 3 months, 5, 10 and 30 years.</div>','c6')
+P('Markets',mon(),'c6')+P('Inflation, CPI year over year','<div class="big">'+f(INF.at(-1),1)+'%</div><canvas id="mi" class="sm"></canvas>','c12')}
const MD={1:[15,5,55,15,5,5],2:[30,10,40,10,5,5],3:[45,15,25,5,5,5],4:[60,20,10,0,5,5],5:[70,25,0,0,5,0]},MT=['VTI','VXUS','AGG','TIP','VNQ','GLD'],ML=['','Very conservative','Conservative','Balanced','Growth','Aggressive'];
function wealth(){const w=MD[RK],V=Array(RD.length).fill(0);MT.forEach((t,j)=>{const a=aligned(t);for(let i=0;i<V.length;i++)V[i]+=w[j]/100*1e4*a[i]/a[0]});
const R=V.slice(1).map((v,i)=>v/V[i]-1),m=R.reduce((a,b)=>a+b)/R.length,sd=Math.sqrt(R.reduce((a,b)=>a+(b-m)**2,0)/R.length)*Math.sqrt(252)*100;let pk=0,md=0;V.forEach(v=>{pk=Math.max(pk,v);md=Math.min(md,v/pk-1)});Q.push(()=>line('wv',[{d:V,c:'--am'}],x=>'$'+f(x,0)));
const sel='<select class="in" style="width:auto;padding:5px" onchange="RK=+this.value;render()">'+[1,2,3,4,5].map(k=>'<option value="'+k+'"'+(k==RK?' selected':'')+'>'+ML[k]+'</option>').join('')+'</select>';
return P('Risk level',sel+T(['Fund','Weight'],MT.map((t,j)=>[LK(t),w[j]+'%']))+'<div class="mu">Example mixes of broad ETFs. Not advice.</div>','c4')
+P('Results over 2 years','<div class="big">$'+f(V.at(-1),0)+'</div><div class="mu">from $10,000, no rebalancing</div>'+KV('Return',pc((V.at(-1)/V[0]-1)*100))+KV('Volatility, annual',f(sd,1)+'%')+KV('Max drawdown',f(md*100,1)+'%')+KV('Est. loss in a 20% selloff',f(MT.reduce((a,t,j)=>a+w[j]*A(t).b*.2,0),1)+'%'),'c4')
+P('Growth of $10,000','<canvas id="wv" class="sm" style="height:200px"></canvas>','c4')}
function crypto(){return P('Major cryptocurrencies',T(['Coin','Price','30d','1y','Volatility (60d)','Beta vs avg stock','From 1y high'],Object.keys(EXT).filter(t=>EXT[t].g=='Crypto').map(t=>{const c=EXT[t].c;return[LK(t,EXT[t].n),'$'+f(c.at(-1),dg(c.at(-1))),pc(rn(c,30)),pc(rn(c,365)),f(EXT[t].v,0)+'%',f(EXT[t].b),pc((c.at(-1)/Math.max(...c.slice(-365))-1)*100)]})),'c12')}
function fx(){return P('Currency pairs and conversions','Amount in USD <input type="number" class="in" style="width:140px" value="'+FA+'" onchange="FA=+this.value||1;render()">'+T(['Pair','Rate','1d','1y','Volatility','Amount buys'],Object.keys(EXT).filter(t=>EXT[t].g=='Currency').map(t=>{const c=EXT[t].c,r=c.at(-1),n=EXT[t].n,u=n.endsWith('/USD'),cc=u?n.slice(0,3):n.slice(4);return[LK(t,n),f(r,4),pc(rn(c,1),2),pc(rn(c,252)),f(EXT[t].v,1)+'%',f(u?FA/r:FA*r,0)+' '+cc]})),'c12')}
const SIM='Prices are real. Everything else on this tab is simulated.',REAL='All numbers on this desk are real, from the price data.';
const JOBS=[['Investment banker',ib,SIM,'Deals, comps, buyers and sponsors'],['Equity analyst',eq,SIM,'Financials, estimates, transcripts, models'],['Bond trader',bd,SIM,'Quotes, capital structure, curve, credit'],['Stock analyst',sa,SIM,'Screens, factors, ownership, events'],['Risk analyst',risk,REAL,'Volatility, beta and drawdowns across 500 stocks'],['Quant / strategist',quant,REAL,'Momentum and mean-reversion signals'],['Macro economist',macro,REAL,'Rates, curve, dollar, commodities'],['Wealth advisor',wealth,'Prices are real. Model mixes are examples, not advice.','Model portfolios and their history'],['Crypto analyst',crypto,REAL,'Ten major coins'],['Corporate treasurer (FX)',fx,REAL,'Currency moves and conversions']];
function desks(){return '<section class="p c12" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><h3 style="margin:0">Desk</h3><select class="in" style="width:auto;padding:5px" aria-label="Choose a desk" onchange="JOB=+this.value;render()">'+JOBS.map((j,i)=>'<option value="'+i+'"'+(i==JOB?' selected':'')+'>'+j[0]+'</option>').join('')+'</select><span class="mu">'+JOBS[JOB][3]+'</span></section>'+JOBS[JOB][1]()}
function render(){Q=[];$('#nav').innerHTML=TABS.map((t,i)=>'<button data-a="tab" data-v="'+i+'" class="'+(i==tab?'on':'')+'">'+t+'</button>').join('');$('#hd').textContent=ac+' '+(CO[ac]?CO[ac][0]:EXT[ac].n);$('#v').innerHTML='<div class="mu m" style="margin-bottom:8px">'+NT()+'</div><div class="grid">'+[home,econ,desks,grp,pf][tab]()+'</div>';requestAnimationFrame(()=>Q.forEach(g=>g()))}
const S={open:v=>{ac=v;if(CO[v])cur=v;tab=0},padd:()=>{const t=$('#pt').value.toUpperCase().trim(),n=+$('#ps').value,c=+$('#pc').value||0;if(A(t)&&n>0){const h=PF.find(z=>z.t==t);h?(h.n=n,h.c=c):PF.push({t,n,c});sv()}},prm:v=>{PF=PF.filter(h=>h.t!=v);sv()},pload:()=>{PF=$('#pp').value.split('\n').map(l=>l.trim().split(/[\s,]+/)).filter(a=>a[0]&&A(a[0].toUpperCase())&&+a[1]>0).map(a=>({t:a[0].toUpperCase(),n:+a[1],c:+a[2]||0}));sv()},pcopy:()=>{try{navigator.clipboard.writeText('Ticker\tShares\tCost\n'+PF.map(h=>h.t+'\t'+h.n+'\t'+h.c).join('\n'));$('#pm').textContent='Copied. Paste into Excel.'}catch(e){$('#pm').textContent='Clipboard blocked here.'}return 'skip'},xr:v=>{XR=v},zi:()=>{gzoom(.7);return 'skip'},zo:()=>{gzoom(1.4);return 'skip'},zr:()=>{gz=[0,1];drawG();return 'skip'},preset:v=>{SEL=PRE[v].filter(t=>CO[t]||EXT[t]).slice(0,10)},rm:v=>{SEL=SEL.filter(t=>t!=v)},clr:()=>{SEL=[]},gr:v=>{GR=v;gz=[0,1]},vp:()=>{VPON^=1},ma:v=>MA[v]^=1,iv:v=>iv=v,tab:v=>tab=+v,opt:v=>opt=v,cls:v=>cls=v,cp};
document.onclick=e=>{const b=e.target.closest('[data-a]');if(b&&S[b.dataset.a](b.dataset.v)!=='skip')render()};
function go(v){v=v.toUpperCase().trim();if(CO[v]){cur=ac=v;render()}else if(EXT[v]){ac=v;render()}}
$('#tk').innerHTML=Object.keys(CO).map(k=>'<option value="'+k+'">'+CO[k][0]+'</option>').join('')+Object.keys(EXT).map(k=>'<option value="'+k+'">'+EXT[k].n+' ('+EXT[k].g+')</option>').join('');
addEventListener('resize',()=>Q.forEach(g=>g()));render();
</script></body></html>
